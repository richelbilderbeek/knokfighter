# Build the Qt version of the game
name: Build game

on:
  push:
  pull_request:

jobs:
  build_linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-multimedia-dev libgl-dev

      - name: Build
        run: |
          mkdir build
          cd build
          qmake6 ../knokfighter.pro
          make -j4

  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          modules: 'qtmultimedia'
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        shell: cmd
        run: |
          mkdir build
          cd build
          qmake ..\knokfighter.pro
          nmake release

      - name: Collect the executable and the Qt libraries it needs
        shell: cmd
        run: |
          mkdir knokfighter
          copy build\release\knokfighter.exe knokfighter\
          copy LICENSE knokfighter\
          windeployqt --release --no-translations knokfighter\knokfighter.exe

      - uses: actions/upload-artifact@v4
        with:
          name: knokfighter_windows
          path: knokfighter
